name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # actions/checkout stores the tag as lightweight; fetch the annotated
          # tag so its message can be used as the release notes.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A release was already created by hand; attach the assets to it.
            gh release upload "$tag" main.js manifest.json --clobber
          else
            gh release create "$tag" --title="$tag" --verify-tag --notes-from-tag main.js manifest.json
          fi
